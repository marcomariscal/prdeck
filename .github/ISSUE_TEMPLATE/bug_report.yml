name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

        Please do **not** include secrets (tokens, API keys, private repo names, etc).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: "Example: Refresh fails after waking from sleep"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it reliably?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Example: PR list updates within a few seconds"
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "Example: App shows error banner: …"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recording
      description: Drag and drop images here, if helpful.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output (redact anything sensitive).
      placeholder: |
        macOS version:
        PRDeck version:
        Install method (source/release):

        gh --version:

        gh auth status:
    validations:
      required: true
