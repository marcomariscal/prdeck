<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-label="PRDeck screenshot (demo)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="620" fill="url(#bg)"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="50" y="50" width="420" height="520" rx="18" fill="#0b1220" stroke="#263246" stroke-width="1"/>

    <!-- Titlebar -->
    <rect x="50" y="50" width="420" height="42" rx="18" fill="#0b1220"/>
    <text x="260" y="77" text-anchor="middle" font-size="14" font-weight="600"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          fill="#a7b0c0">PRDeck</text>
    <line x1="50" y1="92" x2="470" y2="92" stroke="#263246" stroke-width="1"/>

    <!-- Header bar -->
    <rect x="70" y="112" width="320" height="34" rx="12" fill="#0b1220" stroke="#263246"/>
    <circle cx="90" cy="129" r="6" fill="#6b7280"/>
    <line x1="104" y1="129" x2="104" y2="129" stroke="#6b7280"/>
    <text x="110" y="134" font-size="12" font-weight="500"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          fill="#94a3b8">Search</text>

    <!-- Filter icon -->
    <g transform="translate(410 112)">
      <circle cx="17" cy="17" r="15" fill="#0b1220" stroke="#263246"/>
      <path d="M10 12h14M12 17h10M14 22h6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="9" r="7" fill="#3b82f6"/>
      <text x="27" y="12" text-anchor="middle" font-size="9" font-weight="700"
            font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
            fill="#0b1220">3</text>
    </g>

    <!-- Rows -->
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      <!-- Row template positions -->
      <!-- Row 1 -->
      <g transform="translate(62 168)">
        <rect x="0" y="0" width="396" height="62" rx="14" fill="#0b1628" stroke="#263246"/>
        <circle cx="32" cy="31" r="16" fill="#1f2937"/>
        <text x="60" y="26" font-size="12.5" font-weight="650" fill="#e5e7eb">Fix: tighten toolbar sizing on macOS</text>
        <text x="60" y="44" font-size="11" font-weight="500" fill="#94a3b8">marco/prdeck • #128 • updated 2m ago</text>
        <circle cx="368" cy="31" r="10" fill="#10b981"/>
        <path d="M364 31l3 3 6-7" fill="none" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(62 238)">
        <rect x="0" y="0" width="396" height="62" rx="14" fill="#0b1220" stroke="#263246"/>
        <circle cx="32" cy="31" r="16" fill="#1f2937"/>
        <text x="60" y="26" font-size="12.5" font-weight="650" fill="#e5e7eb">Refactor: unify header + list layout</text>
        <text x="60" y="44" font-size="11" font-weight="500" fill="#94a3b8">acme/infra • #512 • updated 14m ago</text>
        <circle cx="368" cy="31" r="10" fill="#f59e0b"/>
        <path d="M362 31h12" fill="none" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(62 308)">
        <rect x="0" y="0" width="396" height="62" rx="14" fill="#0b1220" stroke="#263246"/>
        <circle cx="32" cy="31" r="16" fill="#1f2937"/>
        <text x="60" y="26" font-size="12.5" font-weight="650" fill="#e5e7eb">CI failing: address flakey UI test</text>
        <text x="60" y="44" font-size="11" font-weight="500" fill="#94a3b8">acme/mobile • #77 • updated 1h ago</text>
        <circle cx="368" cy="31" r="10" fill="#ef4444"/>
        <path d="M364 27l8 8M372 27l-8 8" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- Row 4 -->
      <g transform="translate(62 378)">
        <rect x="0" y="0" width="396" height="62" rx="14" fill="#0b1220" stroke="#263246"/>
        <circle cx="32" cy="31" r="16" fill="#1f2937"/>
        <text x="60" y="26" font-size="12.5" font-weight="650" fill="#e5e7eb">Draft: add repo include/exclude filters</text>
        <text x="60" y="44" font-size="11" font-weight="500" fill="#94a3b8">marco/prdeck • #129 • updated 3h ago</text>
        <circle cx="368" cy="31" r="10" fill="#64748b"/>
        <path d="M362 34c6-10 18-10 24 0" fill="none" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- Row 5 -->
      <g transform="translate(62 448)">
        <rect x="0" y="0" width="396" height="62" rx="14" fill="#0b1220" stroke="#263246"/>
        <circle cx="32" cy="31" r="16" fill="#1f2937"/>
        <text x="60" y="26" font-size="12.5" font-weight="650" fill="#e5e7eb">Blocked: waiting on approvals</text>
        <text x="60" y="44" font-size="11" font-weight="500" fill="#94a3b8">acme/backend • #9001 • updated 1d ago</text>
        <circle cx="368" cy="31" r="10" fill="#f59e0b"/>
        <path d="M366 29h4v8h-4z" fill="#0b1220"/>
        <path d="M366 27c0-2 1.3-3.5 3-3.5s3 1.5 3 3.5v2h-6z" fill="#0b1220"/>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <text x="260" y="604" text-anchor="middle" font-size="12" font-weight="500"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        fill="#94a3b8">Demo UI (no real repo data)</text>
</svg>

